services:
  postgres:
    image: postgres:16-alpine
    container_name: tradingview-lite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in postgres.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in postgres.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in postgres.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tradingview_lite_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  tradingview_lite_postgres:
    name: tradingview_lite_postgres
